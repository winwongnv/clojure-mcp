[project]
name = "python3-mcp"
version = "0.1.0-alpha"
description = "A Model Context Protocol (MCP) server for Python, enabling AI-assisted Python development."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"} # Or another appropriate open-source license
authors = [
    {name = "AI Agent Jules & AI Core Eve", email = "noreply@example.com"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ipykernel>=6.0.0,<7.0.0",    # For Jupyter kernel interaction
    "libcst>=0.4.0,<1.0.0",      # For Concrete Syntax Tree manipulation
    "ruff>=0.1.0,<1.0.0",        # For linting and formatting
    "jedi>=0.18.0,<0.19.0",       # For introspection and completion
    "websockets>=10.0,<13.0"     # For potential WebSocket communication with MCP clients
]

[project.urls]
Homepage = "https://example.com/python3-mcp" # Placeholder
Repository = "https://example.com/python3-mcp.git" # Placeholder

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "UP", "PL", "PT"] # General sensible defaults
ignore = ["E501"] # Ignore line too long, handled by formatter

[tool.ruff.format]
quote-style = "double"
